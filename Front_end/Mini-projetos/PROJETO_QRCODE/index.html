<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de QR Code</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/scripts.js" defer></script>
  </head>
  <body>
    
    <div class="container">
      <header id="qr-header">
        <h1>Gerador de QR Code</h1>
        <p>Insira uma URL ou texto, para criar um QR Code</p>
      </header>
      <div id="qr-form">
        <input type="text" placeholder="Digite a URL ou texto..." aria-label="URL ou texto para gerar o QR Code" />
        <button type="button">Gerar QR Code</button>
      </div>
      <div id="qr-code">
        <img alt="QR Code gerado" />
      </div>
    </div>

  </body>
</html>
